<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Subtle Radial Glow behind UI card -->
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Clean Tech Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <!-- UI Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Container Base -->
  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="920" cy="180" r="220" fill="url(#cardGlow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- ================= LEFT COLUMN: BRAND & INFORMATION ================= -->
  <g transform="translate(64, 0)">
    
    <!-- Version & Status Pill -->
    <g transform="translate(0, 52)">
      <rect width="254" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="font-mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">OPEN SOURCE • COLAB READY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-sans" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        CargamezVision
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 162)">
      <text x="0" y="0" class="font-sans" font-size="17" font-weight="400" fill="#94a3b8">
        Real-time dual-hand gesture controlled 3D racing simulator.
      </text>
      <text x="0" y="24" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
        Powered by Google MediaPipe vision tracking and Three.js WebGL engine.
      </text>
    </g>

    <!-- Specs / Architecture Tags -->
    <g transform="translate(0, 246)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Google Colab</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(126, 0)">
        <rect width="138" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="69" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">MediaPipe Hands</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(272, 0)">
        <rect width="108" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="54" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Three.js 3D</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(388, 0)">
        <rect width="128" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="64" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Web Audio API</text>
      </g>
    </g>

    <!-- Minimal bottom link text -->
    <g transform="translate(0, 308)">
      <text x="0" y="0" class="font-mono" font-size="11" fill="#475569">Zero drivers • Zero hardware controllers • Runs in any browser</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SLEEK MINIMALIST UI CARD ================= -->
  <g transform="translate(680, 42)">
    <!-- Window Outer Container -->
    <rect width="456" height="276" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 446 0 C 451.523 0 456 4.477 456 10 L 456 34 L 0 34 Z" fill="#0d131f" />
    <line x1="0" y1="34" x2="456" y2="34" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Window Controls (Mac dots) -->
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="46" cy="17" r="4.5" fill="#10b981" fill-opacity="0.75" />
    
    <text x="228" y="21" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">telemetry.live // 60_fps</text>

    <!-- Card Content Area -->
    <g transform="translate(24, 52)">

      <!-- Left Sub-card: Interactive Gesture Wheel Diagram -->
      <g transform="translate(0, 0)">
        <rect width="230" height="186" rx="8" fill="#080c14" stroke="#172033" stroke-width="1" />
        
        <!-- Subtle crosshair grid in the viewer -->
        <line x1="115" y1="16" x2="115" y2="170" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 4" />
        <line x1="16" y1="93" x2="214" y2="93" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 4" />

        <!-- Minimalist Steering Wheel Graphic (Tilted -12 deg) -->
        <g transform="translate(115, 93) rotate(-12)">
          <!-- Outer Wheel -->
          <circle cx="0" cy="0" r="54" fill="none" stroke="#1e293b" stroke-width="7" />
          <circle cx="0" cy="0" r="54" fill="none" stroke="url(#wheelRim)" stroke-width="4" stroke-dasharray="60 25 60 25" />
          <!-- Spokes -->
          <line x1="-54" y1="0" x2="54" y2="0" stroke="#38bdf8" stroke-width="3" />
          <line x1="0" y1="0" x2="0" y2="54" stroke="#38bdf8" stroke-width="3" />
          <!-- Hub -->
          <circle cx="0" cy="0" r="14" fill="#0b111e" stroke="#38bdf8" stroke-width="2" />
          
          <!-- Left Grip Point Indicator -->
          <circle cx="-54" cy="0" r="7" fill="#0284c7" />
          <circle cx="-54" cy="0" r="3" fill="#ffffff" />
          
          <!-- Right Grip Point Indicator -->
          <circle cx="54" cy="0" r="7" fill="#0284c7" />
          <circle cx="54" cy="0" r="3" fill="#ffffff" />
        </g>

        <!-- Live angle tag -->
        <rect x="80" y="152" width="70" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
        <text x="115" y="166" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">ANGLE -12°</text>
      </g>

      <!-- Right Sub-panel: Real-Time Telemetry Stats -->
      <g transform="translate(242, 0)">
        
        <!-- Metric Box 1: Speed -->
        <g transform="translate(0, 0)">
          <rect width="166" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9.5" font-weight="600" fill="#64748b">SPEED</text>
          <text x="14" y="44" class="font-sans" font-size="22" font-weight="800" fill="#ffffff">218 <tspan font-size="11" font-weight="600" fill="#0284c7">KM/H</tspan></text>
        </g>

        <!-- Metric Box 2: Gesture Mode -->
        <g transform="translate(0, 64)">
          <rect width="166" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9.5" font-weight="600" fill="#64748b">INPUT STATE</text>
          <text x="14" y="42" class="font-mono" font-size="13" font-weight="700" fill="#10b981">✊ FISTS // GAS</text>
        </g>

        <!-- Metric Box 3: Engine State -->
        <g transform="translate(0, 128)">
          <rect width="166" height="58" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9.5" font-weight="600" fill="#64748b">GEAR &amp; NITRO</text>
          <text x="14" y="42" class="font-mono" font-size="13" font-weight="700" fill="#f59e0b">GEAR 5 • 92%</text>
        </g>

      </g>
    </g>
  </g>
</svg>
