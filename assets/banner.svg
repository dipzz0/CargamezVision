<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f1c" />
      <stop offset="100%" stop-color="#ff3838" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Speed Lines Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00e5ff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
    @keyframes dash { to { stroke-dashoffset: -100; } }
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Roboto', sans-serif; font-weight: 900; }
    .sub-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .mono-font { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="420" fill="url(#bgGrad)" />
  <rect width="1280" height="420" fill="url(#dotPattern)" />

  <!-- Outer Neon Border Frame -->
  <rect x="12" y="12" width="1256" height="396" rx="14" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1.5" />
  <rect x="16" y="16" width="1248" height="388" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Subtle Perspective Road Grid on Right Bottom -->
  <g opacity="0.75">
    <line x1="500" y1="410" x2="800" y2="240" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1" />
    <line x1="640" y1="410" x2="820" y2="240" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.5" />
    <line x1="780" y1="410" x2="840" y2="240" stroke="#ff9f1c" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="920" y1="410" x2="860" y2="240" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.5" />
    <line x1="1060" y1="410" x2="880" y2="240" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1" />
    <line x1="1200" y1="410" x2="900" y2="240" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1" />

    <!-- Horizon Line Glow -->
    <ellipse cx="850" cy="240" rx="280" ry="1.5" fill="#00e5ff" opacity="0.3" filter="url(#glowCyan)" />
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#39ff88" filter="url(#glowCyan)" />
      <text x="30" y="19" class="mono-font" font-size="11.5" font-weight="700" fill="#00e5ff" letter-spacing="1.5">COMPUTER VISION • 3D SIMULATOR</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" class="title-font" font-size="58" font-weight="900" fill="url(#cyanGlow)" letter-spacing="2" filter="url(#glowCyan)">CARGAMEZ VISION</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" class="sub-font" font-size="20" fill="#e2e8f0" font-weight="600" letter-spacing="0.3">
        Real-Time Hand Gesture Controlled 3D Racing Experience
      </text>
    </g>

    <!-- Descriptive Bullets / Feature Highlights -->
    <g transform="translate(0, 232)">
      <text x="0" y="0" class="sub-font" font-size="14.5" fill="#94a3b8" letter-spacing="0.2">
        Drive directly in Google Colab using just your webcam — no keyboard, no controller required.
      </text>
      <text x="0" y="24" class="sub-font" font-size="14.5" fill="#64748b" letter-spacing="0.2">
        Powered by <tspan fill="#38bdf8" font-weight="600">MediaPipe Hands 21-Keypoint Tracking</tspan> &amp; <tspan fill="#ff9f1c" font-weight="600">Three.js WebGL Engine</tspan>
      </text>
    </g>

    <!-- Tech Feature Badges Row -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: Colab Ready -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="7" fill="#132338" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1" />
        <text x="14" y="22" class="mono-font" font-size="12" font-weight="700" fill="#38bdf8">☁️ Google Colab</text>
      </g>

      <!-- Badge 2: MediaPipe AI -->
      <g transform="translate(150, 0)">
        <rect width="130" height="34" rx="7" fill="#132338" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1" />
        <text x="14" y="22" class="mono-font" font-size="12" font-weight="700" fill="#38bdf8">🖐️ MediaPipe AI</text>
      </g>

      <!-- Badge 3: Three.js 3D -->
      <g transform="translate(292, 0)">
        <rect width="120" height="34" rx="7" fill="#132338" stroke="#ff9f1c" stroke-opacity="0.35" stroke-width="1" />
        <text x="14" y="22" class="mono-font" font-size="12" font-weight="700" fill="#ff9f1c">🎮 Three.js 3D</text>
      </g>

      <!-- Badge 4: Web Audio Synth -->
      <g transform="translate(424, 0)">
        <rect width="135" height="34" rx="7" fill="#132338" stroke="#39ff88" stroke-opacity="0.35" stroke-width="1" />
        <text x="14" y="22" class="mono-font" font-size="12" font-weight="700" fill="#39ff88">🔊 Audio Engine</text>
      </g>

      <!-- Badge 5: Zero Install -->
      <g transform="translate(571, 0)">
        <rect width="118" height="34" rx="7" fill="#132338" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
        <text x="14" y="22" class="mono-font" font-size="12" font-weight="700" fill="#cbd5e1">⚡ Zero Config</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive Graphic: HUD & Gesture Steering Wheel Visualizer -->
  <g transform="translate(980, 205)">
    <!-- Outer Glow Ambient -->
    <circle cx="0" cy="0" r="145" fill="#00e5ff" fill-opacity="0.04" filter="url(#glowCyan)" />

    <!-- Circular HUD Ring (Speedo / Steering Base) -->
    <circle cx="0" cy="0" r="125" fill="#040b17" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="3" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1e293b" stroke-width="8" />
    
    <!-- Active Speed Arc (Glowing Cyan to Orange) -->
    <path d="M -77.7 77.7 A 110 110 0 1 1 77.7 77.7" fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-linecap="round" filter="url(#glowCyan)" />

    <!-- Steering Wheel Geometry (Angled 18 deg like in game) -->
    <g transform="rotate(-15)">
      <!-- Wheel Outer Rim -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#e0f2fe" stroke-width="7" filter="url(#glowCyan)" />
      <!-- Wheel Inner Ring -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="89" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Spokes -->
      <line x1="-82" y1="0" x2="82" y2="0" stroke="#00e5ff" stroke-width="7" />
      <line x1="0" y1="0" x2="0" y2="82" stroke="#00e5ff" stroke-width="7" />
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="22" fill="#0b172a" stroke="#00e5ff" stroke-width="3" />
      <!-- Top Alignment Marker (Red) -->
      <rect x="-4" y="-89" width="8" height="14" fill="#ff3838" rx="2" />
      <!-- Grip Hand Anchors (Cyan/Neon dots) -->
      <circle cx="-82" cy="0" r="10" fill="#00e5ff" filter="url(#glowCyan)" />
      <circle cx="82" cy="0" r="10" fill="#00e5ff" filter="url(#glowCyan)" />
    </g>

    <!-- Speedometer Readout in Center -->
    <text x="0" y="-8" class="title-font" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">218</text>
    <text x="0" y="8" class="mono-font" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">KM / H</text>
    <text x="0" y="24" class="title-font" font-size="13" font-weight="800" fill="#ff9f1c" text-anchor="middle">GEAR 5</text>

    <!-- HUD Telemetry Badges Around Wheel -->
    <g transform="translate(0, 115)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#061224" stroke="#39ff88" stroke-width="1.2" />
      <circle cx="-48" cy="0" r="3.5" fill="#39ff88" filter="url(#glowCyan)" />
      <text x="12" y="4" class="mono-font" font-size="10" font-weight="700" fill="#39ff88" text-anchor="middle">TRACKING: 60 FPS</text>
    </g>

    <!-- Gesture Chip Left -->
    <g transform="translate(-145, -75)">
      <rect width="84" height="22" rx="4" fill="#091427" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" />
      <text x="42" y="15" class="mono-font" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">✊ LEFT FIST</text>
    </g>

    <!-- Gesture Chip Right -->
    <g transform="translate(62, -75)">
      <rect width="84" height="22" rx="4" fill="#091427" stroke="#ff9f1c" stroke-opacity="0.6" stroke-width="1" />
      <text x="42" y="15" class="mono-font" font-size="9.5" font-weight="700" fill="#ff9f1c" text-anchor="middle">☝️ NITRO UP</text>
    </g>
  </g>
</svg>
